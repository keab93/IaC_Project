#cloud-config
package_update: true
package_upgrade: true
packages:
  - apache2

write_files:
  - path: /var/www/html/index.html
    owner: root:root
    permissions: "0644"
    content: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>IaC Demo</title>
        </head>
        <body>
          <h1>Hello from Terraform on Azure</h1>
          <p>Provisioned with cloud-init.</p>
        </body>
      </html>

runcmd:
  - systemctl enable apache2
  - systemctl restart apache2
